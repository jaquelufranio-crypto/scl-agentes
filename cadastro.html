<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orion SCL — Criar Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#0a0015;font-family:'Inter',sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;background:linear-gradient(160deg,#1a0535 0%,#0d0120 100%);border:1px solid rgba(192,132,252,.15);border-radius:20px;padding:40px 28px;text-align:center}

/* ORB */
.orb-wrap{position:relative;width:120px;height:120px;margin:0 auto 24px}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(192,132,252,.18);animation:spin 18s linear infinite}
.orb-ring2{position:absolute;inset:14px;border-radius:50%;border:1px dashed rgba(192,132,252,.1);animation:spin 12s linear infinite reverse}
.orb-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,rgba(147,51,234,.7) 0%,rgba(88,28,135,.4) 50%,rgba(6,0,16,.9) 100%);border:1.5px solid rgba(192,132,252,.5);box-shadow:0 0 30px rgba(147,51,234,.5);display:flex;align-items:center;justify-content:center;font-size:20px}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{font-size:10px;font-weight:700;letter-spacing:.2em;color:rgba(192,132,252,.7);text-transform:uppercase;margin-bottom:8px}
.title{font-size:22px;font-weight:900;margin-bottom:6px}
.title span{color:#c084fc}
.sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:28px;line-height:1.6}

.step-info{background:rgba(192,132,252,.06);border:1px solid rgba(192,132,252,.15);border-radius:10px;padding:12px 16px;margin-bottom:24px;font-size:12px;color:rgba(255,255,255,.5);line-height:1.7;text-align:left}
.step-info strong{color:rgba(192,132,252,.9);display:block;margin-bottom:4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}

label{font-size:11px;font-weight:600;color:rgba(255,255,255,.4);text-align:left;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;font-size:16px;font-family:'Inter',sans-serif;color:#fff;outline:none;margin-bottom:14px;-webkit-appearance:none}
input:focus{border-color:rgba(192,132,252,.6)}
input::placeholder{color:rgba(255,255,255,.2)}

.btn{width:100%;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;color:#fff;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}

.msg{font-size:12px;margin-top:14px;padding:10px 14px;border-radius:8px;display:none;text-align:left;line-height:1.6}
.msg.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#fca5a5}
.msg.success{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#86efac}

.footer{font-size:10px;color:rgba(255,255,255,.15);margin-top:20px}
.footer span{color:rgba(192,132,252,.4)}

.login-link{font-size:12px;color:rgba(192,132,252,.6);margin-top:16px;display:block}
.login-link a{color:#c084fc;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="orb-wrap">
    <div class="orb-ring"></div>
    <div class="orb-ring2"></div>
    <div class="orb-center">✦</div>
  </div>
  <p class="badge">Sistema de Conteúdo Lucrativo</p>
  <h1 class="title">Criar seu <span>acesso</span></h1>
  <p class="sub">Use o mesmo email com que você fez a compra</p>

  <div class="step-info">
    <strong>Como funciona</strong>
    Digite o email da compra e crie uma senha. Na próxima vez, use email + senha para entrar.
  </div>

  <label>Email da compra</label>
  <input type="email" id="emailInput" placeholder="seu@email.com">

  <label>Criar senha</label>
  <input type="password" id="senhaInput" placeholder="Mínimo 6 caracteres">

  <label>Confirmar senha</label>
  <input type="password" id="confirmaInput" placeholder="Repita a senha">

  <button class="btn" id="btnCadastro" onclick="cadastrar()">Criar meu acesso</button>

  <div class="msg" id="msg"></div>
  <span class="login-link">Já tem senha? <a href="index.html">Fazer login</a></span>
  <p class="footer">Powered by <span>SCL ✦ Jaqueline Lufranio</span></p>
</div>

<script>
const WORKER_URL = 'https://green-darkness-8487.jaque-lufranio.workers.dev';

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

async function cadastrar() {
  const email = document.getElementById('emailInput').value.trim();
  const senha = document.getElementById('senhaInput').value;
  const confirma = document.getElementById('confirmaInput').value;
  const btn = document.getElementById('btnCadastro');

  if (!email || !senha || !confirma) {
    showMsg('Preencha todos os campos.', 'error'); return;
  }
  if (senha !== confirma) {
    showMsg('As senhas não coincidem.', 'error'); return;
  }
  if (senha.length < 6) {
    showMsg('A senha deve ter pelo menos 6 caracteres.', 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = 'Criando acesso...';

  try {
    const res = await fetch(WORKER_URL + '/cadastro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha })
    });
    const data = await res.json();

    if (data.success) {
      showMsg('✓ Acesso criado com sucesso! Redirecionando para o login...', 'success');
      setTimeout(() => window.location.href = 'index.html', 2000);
    } else {
      showMsg(data.error || 'Erro ao criar acesso.', 'error');
      btn.disabled = false;
      btn.textContent = 'Criar meu acesso';
    }
  } catch (e) {
    showMsg('Erro de conexão. Tente novamente.', 'error');
    btn.disabled = false;
    btn.textContent = 'Criar meu acesso';
  }
}

// Enter para cadastrar
document.addEventListener('keydown', e => { if (e.key === 'Enter') cadastrar(); });
</script>
</body>
</html>
